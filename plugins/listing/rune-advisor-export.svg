<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Plugin Hub listing image, 16:9: a screenshot of the planner, dimmed, with the plugin's name. Our own
       interface and mark only, no Jagex artwork. Render: rsvg-convert -w 1280 -h 720 this.svg -o this.png
       (run in this folder, so the screenshot beside it is found). -->
  <defs>
    <filter id="soft" x="0" y="0" width="100%" height="100%"><feGaussianBlur stdDeviation="1.1"/></filter>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0c0b" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#0d0c0b" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#0d0c0b" stop-opacity="0.38"/>
    </linearGradient>
  </defs>
  <image xlink:href="planner-screenshot.png" x="0" y="0" width="1280" height="720" filter="url(#soft)"/>
  <rect width="1280" height="720" fill="url(#shade)"/>
  <!-- a plate behind the name, so the screenshot's own text does not run through it -->
  <rect x="180" y="238" width="920" height="244" rx="18" fill="#171614" fill-opacity="0.94" stroke="#e0a657" stroke-opacity="0.55" stroke-width="2"/>
  <!-- the site's mark (site/assets/icon.svg) and the name, centred -->
  <g transform="translate(232 284) scale(4.75)">
    <rect width="32" height="32" rx="6" fill="#7a4b12"/>
    <path d="M9 24V8h8a5 5 0 0 1 1.6 9.7L23 24h-3.6l-4-6H12v6zm3-9h4.6a2 2 0 0 0 0-4H12z" fill="#fbfaf7"/>
  </g>
  <g font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-weight="700">
    <text x="424" y="372" font-size="92" fill="#fbfaf7">Rune Advisor</text>
    <text x="428" y="432" font-size="46" fill="#e0a657" font-weight="400" letter-spacing="6">EXPORT</text>
  </g>
</svg>
